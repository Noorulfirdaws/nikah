<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nikah — Find a Spouse, Not Just a Match</title>
    <meta name="description" content="The Muslim marriage platform built for serious Nikah. Verified profiles, family involvement, and marriage-focused compatibility — never casual dating." />

    <!--
      Security headers are now set as real HTTP response headers in
      vercel.json (production) and vite.config.ts (dev server) — CSP,
      HSTS, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, and
      Permissions-Policy. Meta-tag delivery can't set frame-ancestors or
      HSTS at all and is weaker for the rest, so it's intentionally not
      duplicated here.
    -->

    <!-- Opt out of browser XSS filtering (superseded by CSP but kept for legacy browsers) -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Google Fonts — the only permitted external resource -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
